name: OpenCode review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  review:
    if: >-
      vars.OPENCODE_BOT_ENABLED == 'true' &&
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' &&
          !github.event.pull_request.draft &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
          (contains(github.event.comment.body, '/opencode') ||
           contains(github.event.comment.body, '/oc'))) ||
        (github.event_name == 'pull_request_review_comment' &&
          (github.event.comment.in_reply_to_id != null ||
           contains(github.event.comment.body, '/opencode') ||
           contains(github.event.comment.body, '/oc')))
      )
    concurrency:
      group: opencode-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check requester, mode and PR origin
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const repo = process.env.GITHUB_REPOSITORY;
          const eventName = process.env.GITHUB_EVENT_NAME;
          const MARKER = '<!-- opencode-github-review -->';
          const REQUEST = /(^|\s)\/(?:opencode|oc)(?=\s|$)/i;
          /** Read GitHub metadata without a shell or request text execution. */
          const api = (path) => JSON.parse(execFileSync('gh', ['api', path], { encoding: 'utf8' }));
          const write = (key, value) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${value}\n`);
          /** Only GitHub App bots may own review threads; a copied marker is not enough. */
          const isBotComment = (comment) =>
            Boolean(comment?.user?.login) &&
            String(comment.user.login).endsWith('[bot]') &&
            String(comment?.body ?? '').includes(MARKER);

          let allowed = false;
          let mode = '';
          let prNumber = '';
          let target = '';
          let botLogin = '';
          let reason = 'unsupported event';

          try {
            const permission = api(`repos/${repo}/collaborators/${process.env.GITHUB_ACTOR}/permission`).permission;
            allowed = ['admin', 'maintain', 'write'].includes(permission);
            if (!allowed) reason = 'requester needs repository write access';

            if (allowed && eventName === 'pull_request' && event.pull_request) {
              mode = 'review';
              prNumber = event.pull_request.number;
              target = prNumber;
              reason = '';
            } else if (allowed && eventName === 'issue_comment' && event.issue) {
              mode = 'issue';
              target = event.issue.number;
              if (event.issue.pull_request) prNumber = event.issue.number;
              if (!REQUEST.test(event.comment?.body ?? '')) {
                allowed = false;
                reason = 'comment does not request /opencode or /oc';
              } else {
                reason = '';
              }
            } else if (
              allowed &&
              eventName === 'pull_request_review_comment' &&
              event.comment &&
              event.pull_request
            ) {
              mode = 'reply';
              prNumber = event.pull_request.number;
              const requested = REQUEST.test(event.comment.body ?? '');
              let current = event.comment;
              let botThread = false;
              const noteBotThread = (comment) => {
                if (!isBotComment(comment)) return;
                botThread = true;
                botLogin = comment.user.login;
              };
              noteBotThread(current);
              while (current?.in_reply_to_id) {
                current = api(`repos/${repo}/pulls/comments/${current.in_reply_to_id}`);
                noteBotThread(current);
              }
              target = current?.id ?? event.comment.id;
              if (!requested && !botThread) {
                allowed = false;
                reason = 'inline comment is not a bot review thread and has no /opencode or /oc request';
              } else {
                reason = '';
              }
            } else if (allowed) {
              allowed = false;
              reason = 'unsupported event payload';
            }

            if (allowed && prNumber) {
              const pr = api(`repos/${repo}/pulls/${prNumber}`);
              if (pr.state !== 'open') {
                allowed = false;
                reason = 'pull request is not open';
              } else if (pr.draft) {
                allowed = false;
                reason = 'pull request is a draft';
              } else if (pr.head?.repo?.full_name !== repo) {
                allowed = false;
                reason = 'pull request is from a fork';
              }
            }
          } catch (error) {
            allowed = false;
            reason = `authorization failed: ${error instanceof Error ? error.message : String(error)}`;
          }

          write('allowed', allowed);
          write('mode', allowed ? mode : '');
          write('pr', allowed ? prNumber : '');
          write('target', allowed ? target : '');
          write('bot_login', allowed ? String(botLogin).replace(/[^A-Za-z0-9_.\[\]-]/g, '') : '');
          if (!allowed) console.log(`Skipped: ${reason}.`);
          NODE

      - name: Checkout pull request head for review
        if: steps.authorize.outputs.allowed == 'true' && steps.authorize.outputs.mode == 'review'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout trusted default branch for conversation replies
        if: steps.authorize.outputs.allowed == 'true' && steps.authorize.outputs.mode != 'review'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify model configuration
        if: steps.authorize.outputs.allowed == 'true'
        env:
          MODEL: ${{ vars.OPENCODE_REVIEW_MODEL }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          test -n "$MODEL" || { echo 'Set OPENCODE_REVIEW_MODEL to a provider/model identifier.'; exit 1; }
          test -n "$OPENCODE_API_KEY" || { echo 'Set the OPENCODE_API_KEY Actions secret.'; exit 1; }

      - name: Install checksum-pinned OpenCode
        if: steps.authorize.outputs.allowed == 'true'
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.5/opencode-linux-x64.tar.gz \
            --output "$RUNNER_TEMP/opencode.tar.gz"
          echo "588310a336fa3b9df36b3f0225b26f679d453efaad0cf3d66c3651ef3ec1647a  $RUNNER_TEMP/opencode.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/opencode-bin"
          tar -xzf "$RUNNER_TEMP/opencode.tar.gz" -C "$RUNNER_TEMP/opencode-bin"
          echo "$RUNNER_TEMP/opencode-bin" >> "$GITHUB_PATH"

      - name: Record reviewed commit
        if: steps.authorize.outputs.allowed == 'true' && steps.authorize.outputs.mode == 'review'
        shell: bash
        run: echo "PR_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare pull request head checkout
        if: steps.authorize.outputs.allowed == 'true' && steps.authorize.outputs.mode != 'review' && steps.authorize.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.authorize.outputs.pr }}
        shell: bash
        run: |
          # The runner fetches PR refs with gh's environment token, rather than
          # storing a token in the checked-out repository.
          git config --global credential.https://github.com.helper '!gh auth git-credential'
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/origin/pr-${PR}"
          git worktree add --detach "$RUNNER_TEMP/pr-head" "refs/remotes/origin/pr-${PR}"
          {
            echo "PR_HEAD_DIR=$RUNNER_TEMP/pr-head"
            echo "PR_HEAD_SHA=$(git -C "$RUNNER_TEMP/pr-head" rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Review or reply
        if: steps.authorize.outputs.allowed == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_REVIEW_MODEL: ${{ vars.OPENCODE_REVIEW_MODEL }}
          OPENCODE_REVIEW_MODE: ${{ steps.authorize.outputs.mode }}
          OPENCODE_PR_NUMBER: ${{ steps.authorize.outputs.pr }}
          OPENCODE_TARGET_ID: ${{ steps.authorize.outputs.target }}
          OPENCODE_BOT_LOGIN: ${{ steps.authorize.outputs.bot_login }}
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          SHARE: "false"
          USE_GITHUB_TOKEN: "true"
          OPENCODE_CONFIG_CONTENT: >-
            {"$schema":"https://opencode.ai/config.json","share":"disabled",
            "small_model":"opencode/deepseek-v4.1-flash-free","plugin":[],
            "permission":{"*":"deny","read":"allow","glob":"allow","grep":"allow",
            "external_directory":"deny","bash":{"*":"deny",
            "gh issue view *":"allow","gh pr view *":"allow","gh pr diff *":"allow",
            "gh search issues *":"allow","git diff *":"allow","git show *":"allow",
            "git log *":"allow","git status *":"allow",
            "*>*":"deny","*<*":"deny","*|*":"deny","*;*":"deny","*&*":"deny",
            "*`*":"deny","*$(*":"deny","*--ext-diff*":"deny","*--textconv*":"deny"}}}
        shell: bash
        run: |
          RUNNER="scripts/opencode-github-review.mjs"
          if [ "$OPENCODE_REVIEW_MODE" = "reply" ] && [ ! -f "$RUNNER" ] && [ -n "${PR_HEAD_DIR:-}" ] && [ -f "$PR_HEAD_DIR/$RUNNER" ]; then
            echo "::notice::The default branch does not have the review runner yet; using the pull request's runner for this pre-merge run."
            RUNNER="$PR_HEAD_DIR/$RUNNER"
          fi
          if [ ! -f "$RUNNER" ]; then
            echo "::notice::The review runner is not on the default branch yet; merge this workflow change to enable conversation replies."
            exit 0
          fi
          export OPENCODE_HEAD_SHA="${PR_HEAD_SHA:-}"
          export PR_HEAD_DIR="${PR_HEAD_DIR:-}"
          node "$RUNNER"
