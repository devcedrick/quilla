name: OpenCode resolve threads

# GitHub only lets an installation token resolve review threads when it also
# has Contents: write. Keep that permission out of `OpenCode review`, which runs
# the model against PR content, and give it to this separate workflow instead.
# This workflow is loaded from and checks out the default branch, so no PR code
# runs with the contents-write token.
on:
  workflow_run:
    workflows: ["OpenCode review"]
    types: [completed]

permissions: {}

concurrency:
  group: opencode-resolve-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: >-
      vars.OPENCODE_BOT_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Download captured thread ids
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          DEST: ${{ runner.temp }}/opencode-resolve
        shell: bash
        run: |
          set -euo pipefail
          artifact=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name == "opencode-resolve-threads") | .id')
          if [ -z "$artifact" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The review run captured no previous bot threads."
            exit 0
          fi
          mkdir -p "$DEST"
          gh run download "$RUN_ID" --name opencode-resolve-threads --dir "$DEST"
          capture=$(find "$DEST" -name 'opencode-resolve-threads.json' -type f -print -quit)
          if [ -z "$capture" ]; then
            echo "::error::The captured thread artifact did not contain opencode-resolve-threads.json."
            exit 1
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "path=$capture" >> "$GITHUB_OUTPUT"

      - name: Resolve previous bot threads
        if: steps.capture.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCODE_REVIEW_MODE: resolve
          OPENCODE_RESOLVE_THREADS_PATH: ${{ steps.capture.outputs.path }}
          OPENCODE_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        shell: bash
        run: node scripts/opencode-github-review.mjs
